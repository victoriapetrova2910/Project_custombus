services:
  db:
    image: postgres:16-alpine
    container_name: custombus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-CustomBus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - custombus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CustomBus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  custombus_pgdata:
